name: Keep Alive — Render & Supabase

on:
  schedule:
    # Every 10 minutes — keeps Render from sleeping (sleeps after 15 min)
    - cron: '*/10 * * * *'
    # Once daily at 6 AM UTC — keeps Supabase from pausing (pauses after 7 days)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  ping-render:
    name: Ping Render Backend
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Render service
        run: |
          echo "Pinging Render — may take up to 60s on cold start..."
          for i in 1 2 3; do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
              --max-time 60 \
              --retry 0 \
              "${{ secrets.RENDER_BACKEND_URL }}/actuator/health" || echo "000")
            echo "Attempt $i → HTTP $STATUS"
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
              echo "✅ Render is alive"
              exit 0
            fi
            echo "Not ready yet, waiting 15s..."
            sleep 15
          done
          echo "⚠️ Render did not respond after 3 attempts — it may still be starting up"
          exit 0

  ping-supabase:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Supabase project
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
            --max-time 30 \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/")
          echo "Supabase responded with HTTP $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
            echo "✅ Supabase is alive"
          else
            echo "⚠️ Unexpected status: $STATUS"
          fi
