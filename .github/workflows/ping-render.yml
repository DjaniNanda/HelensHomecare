name: Ping Render Backend

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    name: Wake up Render
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service
        run: |
          echo "Pinging Render — may take up to 60s on cold start..."
          for i in 1 2 3; do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
              --max-time 60 \
              "${{ secrets.RENDER_BACKEND_URL }}/actuator/health" || echo "000")
            echo "Attempt $i → HTTP $STATUS"
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
              echo "✅ Render is alive"
              exit 0
            fi
            echo "Not ready yet, waiting 15s..."
            sleep 15
          done
          echo "⚠️ Render did not respond — may still be starting"
          exit 0