      rel="stylesheet"
    />

    <!-- ═══════════════════════════════════════════════════════════
         STRUCTURED DATA (JSON-LD) — helps Google show sitelinks
         ═══════════════════════════════════════════════════════════ -->

    <!-- 1. Organization — tells Google who you are -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "HomeAndConstructionBusiness",
      "@id": "https://www.helenshomecarellc.com/#organization",
      "name": "Helen's Home Care",
      "url": "https://www.helenshomecarellc.com",
      "logo": {
        "@type": "ImageObject",
        "url": "https://www.helenshomecarellc.com/logo512.png",
        "width": 512,
        "height": 512
      },
      "image": "https://www.helenshomecarellc.com/logo512.png",
      "description": "Helen's Home Care provides compassionate, non-medical personal care for seniors across Gwinnett County and surrounding Atlanta-area counties. Companion care, personal care, and more.",
      "telephone": "+770-861-4402",
      "email": "helenshomecare14@gmail.com",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Gwinnett County",
        "addressRegion": "GA",
        "addressCountry": "US"
      },
      "areaServed": {
        "@type": "State",
        "name": "Georgia"
      },
      "sameAs": [
        "https://www.facebook.com/helenshomecare",
        "https://www.instagram.com/helenshomecare"
      ]
    }
    </script>

    <!-- 2. WebSite — enables the sitelinks search box + breadcrumb sitelinks -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://www.helenshomecarellc.com/#website",
      "name": "Helen's Home Care",
      "url": "https://www.helenshomecarellc.com",
      "publisher": {
        "@id": "https://www.helenshomecarellc.com/#organization"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://www.helenshomecarellc.com/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- 3. ItemList of key pages — directly signals sitelinks to Google -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ItemList",
      "name": "Helen's Home Care — Main Pages",
      "itemListElement": [
        {
          "@type": "SiteLinksSearchBox",
          "url": "https://www.helenshomecarellc.com"
        },
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Our Services",
          "url": "https://www.helenshomecarellc.com/services/senior-home-care",
          "description": "Compassionate senior home care services tailored to your loved one's needs."
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "Personal Care",
          "url": "https://www.helenshomecarellc.com/services/personal-care",
          "description": "Personal care assistance with daily activities for seniors."
        },
        {
          "@type": "ListItem",
          "position": 3,
          "name": "Companion Care",
          "url": "https://www.helenshomecarellc.com/services/companion-care",
          "description": "Friendly companion care to keep your loved one socially engaged."
        },
        {
          "@type": "ListItem",
          "position": 4,
          "name": "Alzheimer's & Dementia Care",
          "url": "https://www.helenshomecarellc.com/services/alzheimers-care",
          "description": "Specialised memory care for seniors with Alzheimer's or dementia."
        },
        {
          "@type": "ListItem",
          "position": 5,
          "name": "Free Assessment",
          "url": "https://www.helenshomecarellc.com/assessment",
          "description": "Get a free care needs assessment for your loved one today."
        },
        {
          "@type": "ListItem",
          "position": 6,
          "name": "About Us",
          "url": "https://www.helenshomecarellc.com/about",
          "description": "Learn about Helen's Home Care and our mission."
        }
      ]
    }
    </script>

    <!-- Loading screen styles (prevents flash of unstyled content) -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background: #faf8f4;
        font-family: 'Nunito Sans', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #root:empty::before {
        content: '';
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #faf8f4;
      }

      /* Splash loader shown while React bootstraps */
      #app-loader {
        position: fixed;
        inset: 0;
        background: #faf8f4;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.2rem;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #app-loader img {
        width: 140px;
        height: auto;
        animation: pulse 1.8s ease-in-out infinite;
      }
      #app-loader p {
        font-family: 'Playfair Display', Georgia, serif;
        font-style: italic;
        font-size: 1rem;
        color: #7a6f65;
        letter-spacing: 0.03em;
      }
      #loader-bar {
        width: 120px;
        height: 3px;
        background: #e0d8cc;
        border-radius: 99px;
        overflow: hidden;
      }
      #loader-bar::after {
        content: '';
        display: block;
        height: 100%;
        width: 40%;
        background: #c9a84c;
        border-radius: 99px;
        animation: slide 1.4s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1;   transform: scale(1); }
        50%       { opacity: 0.7; transform: scale(0.97); }
      }
      @keyframes slide {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
  </head>

  <body>
    <!-- Splash loader (hidden once React mounts) -->
    <div id="app-loader" aria-hidden="true">
      <img src="/logo.png" alt="Helen's Home Care" />
      <div id="loader-bar"></div>
      <p>Care that feels like home…</p>
    </div>

    <!-- React root -->
    <div id="root"></div>

    <!-- Remove loader once app is ready -->
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const loader = document.getElementById('app-loader');
        const observer = new MutationObserver(function () {
          if (document.getElementById('root').children.length > 0) {
            loader.style.opacity = '0';
            setTimeout(function () { loader.remove(); }, 420);
            observer.disconnect();
          }
        });
        observer.observe(document.getElementById('root'), { childList: true });
      });
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
