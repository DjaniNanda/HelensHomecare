# ========================
# Application
# ========================
spring.application.name=helens-home-care
server.port=8080

# ========================
# H2 Database (Dev)
# ========================
spring.datasource.url=jdbc:h2:mem:helenshomecare;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ========================
# JPA / Hibernate
# ========================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ========================
# Mail (SMTP)
# ========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=helenshomecare14@gmail.com
spring.mail.password=enpn qzim qpgu ptoc
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Admin email (receives notifications)
app.admin.email=helenshomecare14@gmail.com
app.admin.name=Helen's Home Care

# ========================
# Admin Initializer
# ========================
app.admin.username=helene
app.admin.password=helenshomecare14@gmail.com

# ========================
# CORS
# ========================
app.cors.allowed-origins=https://helens-homecare.vercel.app/,http://localhost:5173

# ========================
# Session
# ========================
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure= true
server.servlet.session.cookie.same-site=none
# ========================
# Logging
# ========================
logging.level.com.helenshomecare=DEBUG
logging.level.org.springframework.security=INFO